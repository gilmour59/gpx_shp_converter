name: Build Desktop Release

on:
  push:
    branches:
      - main
    paths:
      - RELEASE_VERSION

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Run tests
        run: python -m pytest -q
      - name: Build Windows package
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --name "GPX_SHP_Converter" --onedir --collect-all streamlit --collect-all geopandas --collect-all pyogrio --collect-all pyproj --collect-all shapely --add-data "app.py;." --add-data "src;src" windows_launcher.py
          Copy-Item "Run_GPX_SHP_Converter.bat" "dist\GPX_SHP_Converter\Run_GPX_SHP_Converter.bat"
          $version = (Get-Content RELEASE_VERSION -Raw).Trim()
          if (-not $version.StartsWith("v")) { $version = "v$version" }
          Compress-Archive -Path "dist\GPX_SHP_Converter\*" -DestinationPath "GPX_SHP_Converter_Windows_$version.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: GPX_SHP_Converter_Windows_*.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Run tests
        run: python -m pytest -q
      - name: Build macOS package
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --name "GPX_SHP_Converter" --onedir --collect-all streamlit --collect-all geopandas --collect-all pyogrio --collect-all pyproj --collect-all shapely --add-data "app.py:." --add-data "src:src" macos_launcher.py
          cp Run_GPX_SHP_Converter.command dist/GPX_SHP_Converter/Run_GPX_SHP_Converter.command
          chmod +x dist/GPX_SHP_Converter/Run_GPX_SHP_Converter.command
          chmod +x dist/GPX_SHP_Converter/GPX_SHP_Converter
          VERSION=$(tr -d '\r\n ' < RELEASE_VERSION)
          [[ "$VERSION" == v* ]] || VERSION="v$VERSION"
          ditto -c -k --sequesterRsrc --keepParent dist/GPX_SHP_Converter "GPX_SHP_Converter_macOS_$VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: GPX_SHP_Converter_macOS_*.zip

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '\r\n ' < RELEASE_VERSION)
          [[ "$VERSION" == v* ]] || VERSION="v$VERSION"
          gh release create "$VERSION" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "GPX to SHP Converter $VERSION" \
            --notes "Desktop release for Windows and macOS.

          For Windows: download the Windows ZIP, extract it, then open Run_GPX_SHP_Converter.bat or GPX_SHP_Converter.exe.

          For macOS: download the macOS ZIP, extract it, then open Run_GPX_SHP_Converter.command. If macOS blocks it because it is unsigned, right-click the file, choose Open, then confirm.

          Python does not need to be installed on end-user computers."
